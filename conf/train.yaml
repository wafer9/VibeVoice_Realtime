# Legacy prototype schema; current TwinLakes entrypoint uses conf/run_stage1_fm.yaml.
# Fixed TwinLakes codec + Qwen3-0.6B + per-frame linear FM DiT.
codec:
  source: /nfs-speech-cfs/wangzhou/s2s/TwinLakes_cfg
  weights: /nfs-speech-cfs/wangzhou/.cache/models/VibeVoice-1.5B
  scale: 0.1962890625
  bias: -0.04931640625

model:
  llm_path: /nfs-speech-cfs/wangzhou/.cache/models/Qwen3-0.6B-Base
  latent_dim: 64
  condition_drop_prob: 0.1
  dit:
    hidden_size: 384
    layers: 4
    heads: 6
    ffn_ratio: 4

streaming:
  # Fixed visibility schedule, NOT a forced alignment. Same in training/inference.
  text_chunk_size: 5
  audio_chunk_size: 6
  max_sequence_length: 2048

data:
  paired_manifests:
    - /nfs-speech-ali-nnn/wangzhou/nfs-speech-cfs/wangzhou/s2s/TwinLakes_vibevoice/data/emilia_sim/zh_en_prompt.list
  audio_roots:
    zh: /nfs-speech-cfs/ASR/opensource/Emilia/ZH
    en: /nfs-speech-cfs/ASR/opensource/Emilia/EN
  min_similarity: 0.8
  min_target_seconds: 1.0
  max_target_seconds: 20.0
  prompt_seconds: [2.0, 5.0]
  validation_fraction: 0.01
  samples_per_shard: 256

training:
  seed: 20261026
  batch_size: 2
  gradient_accumulation: 1
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 100000
  max_epochs: 1000
  max_grad_norm: 1.0
  eos_weight: 0.1
  gradient_checkpointing: true
  amp_bf16: true
  log_every: 10
  save_every: 1000
  eval_every: 1000
